# Publishing, and what it refuses to publish.
#
# The version is not an input to this workflow. It is read from the git tag by sbt-dynver, which is
# the same `git describe` the release convention already asks for. Before 2026-09-15 the version was
# typed into the dispatch form and written into `build.sbt` with `sed`, so what an artifact called
# itself and what the repository was tagged were two copies of one fact and nothing compared them.
# The `ref` input below selects a commit, never a version.
name: Publish Package

on:
  # Automatic triggers disabled to avoid GitHub Actions billing
  # release:
  #   types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. 7.0.1). Defaults to the current branch tip, which will be refused unless it is exactly a tag.'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          # The whole history and every tag: dynver derives the version from `git describe`, and a
          # shallow clone describes nothing.
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      # The official action, after two installations that did not work and one that was believed to.
      #
      # This file installed sbt from the scala-sbt apt repository through `apt-key add`, which is
      # deprecated and gone from current runner images. `ci.yml` had already replaced that with
      # Coursier, in a commit called "Fix CI test failures by using Coursier for SBT installation",
      # so copying `ci.yml` looked like taking the repaired version. It is not repaired: run
      # 34941864795 installed Coursier successfully and then died on `sbt --version` with exit code
      # 127. `cs setup` puts sbt on the PATH by writing a shell profile, and a workflow step does
      # not read one, so sbt does not exist in the step after the one that installed it. Every CI
      # run in this repository has failed the same way and nobody had read the reason.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # A release carries a name, and a name belongs to something reproducible from a commit anybody
      # can name. The version is read from git rather than parsed out of sbt's output, because the
      # first version of this step did the latter: `sbt -error 'print version' | tail -1` returned an
      # ANSI escape sequence, the `+` test below passed on it because an escape sequence contains no
      # `+`, and the release step then tried to open a file named after it. A guard that reads the
      # wrong thing and passes is worse than no guard, and that one reached a release.
      #
      # `git describe --exact-match` is the same fact dynver reads, so the version this names and the
      # version the artifacts carry agree by construction. Where they would not, the distribution
      # step below fails on a missing file, which is the agreement being checked rather than assumed.
      - name: Read the version from the tag, and refuse anything that is not one
        id: version
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the checked-out tree is dirty, so this build is reproducible by nobody."
            exit 1
          fi
          VERSION="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            echo "::error::this commit is not exactly a tag, so it has no release name."
            exit 1
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::$VERSION is not a release tag: three numbers, and no leading v."
              exit 1
              ;;
          esac
          echo "Version from the tag: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run tests
        run: sbt test

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt publish

      # The other artifact. A tarball is not a maven artifact and does not belong on a maven
      # registry: it goes on the release, which is where somebody looking for something to install
      # looks. `--clobber` so that re-running this on the same tag replaces the asset instead of
      # failing on a name that already exists.
      - name: Build the distribution
        run: sbt "dist/Universal/packageZipTarball"

      - name: Attach the distribution to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="target/out/jvm/scala-3.3.5/symbolum-dist/universal/symbolum-${VERSION}.tgz"
          ls -l "$TARBALL"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$TARBALL" --clobber
          else
            echo "::warning::No release named $VERSION, so the distribution was built and not attached."
          fi

      - name: Create package summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Published"
            echo ""
            echo "- **Version**: $VERSION"
            echo "- **Registry**: GitHub Packages"
            echo "- **Repository**: ${{ github.repository }}"
            echo ""
            echo "### The libraries"
            echo ""
            echo '```scala'
            echo 'resolvers += "GitHub Package Registry" at "https://maven.pkg.github.com/${{ github.repository }}"'
            echo ""
            echo "// Everything, at one coordinate:"
            echo "libraryDependencies += \"garden.xeno\" %% \"symbolum\" % \"$VERSION\""
            echo ""
            echo "// Or one link of the chain:"
            echo "libraryDependencies += \"garden.xeno\" %% \"symbolum-theories\" % \"$VERSION\""
            echo '```'
            echo ""
            echo "Published modules: symbolum, symbolum-kernel, symbolum-checker, symbolum-logic,"
            echo "symbolum-theories, symbolum-core, symbolum-tactics."
            echo ""
            echo "### The distribution"
            echo ""
            echo "\`symbolum-$VERSION.tgz\`, attached to the release when one exists for this tag."
            echo "It carries every module's jar and a launcher for each entry point:"
            echo "\`bin/symbolum-ask\`, \`bin/symbolum-find\`, \`bin/symbolum-notebook\`,"
            echo "\`bin/symbolum-repl\`, \`bin/symbolum-what-a-claim-costs\`, and"
            echo "\`bin/symbolum -main <class>\` for anything else in the jars."
          } >> $GITHUB_STEP_SUMMARY
