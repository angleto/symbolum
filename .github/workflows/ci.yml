name: CI

# The triggers name the branches this repository has, which the disabled ones did not: they listed
# `main`, `master`, `develop` and `claude/**`, and the remote holds exactly one branch, `7.0`. The
# `claude/**` ones were pull-request branches from 2025-11 and are gone. Uncommenting them would
# have produced a workflow that is configured to run automatically and never fires, which reads as
# protection and is not.
#
# `[0-9]*.[0-9]*` is a release line: `7.0` today, `7.1` and `8.0` when they exist. A branch that is
# not a release line is verified by opening a pull request against one, or by dispatching this
# workflow by hand, and both are cheaper than running the suite on every push to every experiment.
on:
  workflow_dispatch:
  push:
    branches: [ '[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ '[0-9]*.[0-9]*' ]

# One run per branch at a time, and a run that has started is never cancelled. GitHub keeps at most
# one run pending in a group and cancels the one that was waiting when a newer one queues, so a burst
# of pushes costs the run in progress plus one run on the newest commit, and the tip always gets a
# verdict. What it does not give is a verdict on each intermediate commit that arrived while a run
# was already waiting.
#
# `cancel-in-progress` was `true` until 2026-09-25, written for three commits pushed inside a minute.
# On a line where several sessions land all afternoon and a run takes 24 minutes, the next push
# nearly always came before the verdict: on 2026-09-18 ten runs in a row were cancelled between
# 14:19 and 16:04, and the line reached a verdict only when it stopped moving.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on Scala ${{ matrix.scala }} and JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 21 alone since 2026-09-25: it is what the library asks of a consumer (docs/adr/0051), and
        # sbt 2 runs on 17 or later.
        java: [ '21' ]
        scala: [ '3.3.5' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      # `cs setup` reports success and leaves sbt unreachable: it puts the binary on the PATH by
      # writing a shell profile, and a workflow step starts a shell that reads none, so the step
      # after this one died with exit code 127. Every run this repository ever recorded failed that
      # way, and the commit that introduced the Coursier installation is called "Fix CI test
      # failures by using Coursier for SBT installation", which no run has ever confirmed.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Compile
        run: sbt compile

      # This also runs the `fatalWarnings` gate, and that is deliberate rather than incidental:
      # `Test / test` on the root depends on it, so the check that `-Xfatal-warnings` reaches the
      # compiler costs no step and no runner minute of its own here. It reads the effective options
      # of every project holding sources and then compiles a source that has to fail because of the
      # flag, against a control compiling the same source without it. A red run whose log ends in
      # that task's message is this gate rather than a test: `build.sbt` carries the argument and
      # `tools/fatal-warnings-probe/README.md` the perturbations it was seen failing under.
      #
      # It contributes ONE `[info]` line of its own, and under sbt 2 it can also put the probe's
      # eight `[error]` lines into this log: both probe compilations log into a stream nobody reads,
      # but sbt 2 caches a compile's outcome, a failed one included, and when it serves the probe's
      # failure from that cache it prints the diagnostics it stored, naming the path of whichever
      # checkout first compiled the probe. Counted on 2026-09-26 and again on 2026-09-28. Those
      # eight are the expected ones when the gate's own line says it passed; `CLAUDE.md` has the
      # measurement that a failure served from the cache is still evidence. Sessions here read a run
      # by counting `[error]` lines, after one reporting `827 succeeded, 0 failed` turned out to be a
      # module that had not compiled: the count to compare against is zero where the probe was
      # compiled rather than served, and eight, all of them the probe's, where it was served.
      #
      # Wired to a task rather than written as a step for the reason the step it replaces was worth
      # nothing: a check somebody has to remember to invoke stops existing the day nobody does, and
      # a `-Xfatal-warnings` that has stopped arriving is silent by construction.
      - name: Run tests
        run: sbt test

      # There was a formatting step here and it checked nothing. `scalafmtCheckAll` is not a task
      # this build defines: there is no scalafmt plugin in `project/plugins.sbt` and no
      # `.scalafmt.conf`, so sbt failed, `|| echo` swallowed the failure, and `continue-on-error`
      # swallowed it again. What it produced was a green tick in the job list for a check that could
      # not run and could not fail. Adding scalafmt is a decision about the source; pretending to
      # check it is not, so the step is gone rather than disabled.

  # The gate `build.sbt` describes, run where the memory is. The command is that file's own, word
  # for word, because one measurement described in two places is the defect most of the comments in
  # this repository are about.
  #
  # Why it belongs here rather than only on a development machine. Every floor in `build.sbt` was
  # measured on one laptop, and the run that landed there on 2026-09-16 held between 85 and 207 MB
  # of free memory for its whole ten minutes against a peak resident set of 1922 MB. It passed
  # because nothing else was open at that moment, and `-J-Xmx2g`, which is 458 MB more, is enough to
  # make it die. Verifiability that depends on what else the author has open is not a property a
  # gate can have. A runner has the memory and has nothing else on it.
  #
  # And the hazard `build.sbt` spends a whole section on disappears here by construction rather than
  # by discipline. A report is built from what the instrumented compiler saw, so on an incremental
  # build it covers only the files that were recompiled, and a report over two files passes every
  # floor by being nearly empty. A runner checkout has never been built. What the steps below
  # restore from cache is `~/.ivy2`, `~/.sbt` and coursier, which is dependency resolution and not
  # `target/`; `clean` is kept anyway so that this line and the one a person types are the same
  # line.
  #
  # No `-J-Xmx`, and since 2026-09-25 it would not reach the tests anyway. Each module's tests run
  # in a JVM sbt forks for them, one module at a time, at the `-Xmx1024m` `Test / javaOptions` sets
  # in `build.sbt`, which is the launcher's default and the heap every floor there was measured at
  # while the suite still ran inside the launcher. `-J-Xmx` now reaches only the launcher, which
  # compiles; the comment on `Test / fork` is why the tests left it.
  #
  # One JDK where the suite above runs two. What a floor gates is which statements execute, and that
  # is the same question on 11 and on 17, so a second copy doubles the minutes and not the answer.
  # 17 rather than 11 because it is the newer of the two the suite already covers. The floors
  # themselves were read on a machine running Temurin 23, so the first run of this job is the first
  # reading of them off that machine, and it changes the JDK at the same time: if a figure moves,
  # both are candidates and neither is established.
  #
  # The triggers are the workflow's, unchanged, and that is the decision rather than the default.
  # Dispatch and pull request alone were the cheap option and would have been protection that does
  # not fire: work lands on this line by pushing to it, so a gate that runs only on a pull request
  # runs about never, which is the sentence the `on:` block above already carries about the branches
  # it does not list. What it costs is measured: the first run took 24 minutes against the 26 the
  # rest of the workflow spends, so a full run is about twice what it was. On 2026-09-16 the
  # concurrency group above still cancelled a run in progress, and it cancelled 7 of the 24 runs
  # that day.
  #
  # What that buys and what it risks are both small and both worth knowing. Every floor held on the
  # first run with between 1.9 and 43 statements of margin, and `build.sbt` carries the table. The
  # one to watch is `scan`: 185 statements at 99.0 is one statement of slack, so that module is where
  # a red line will come from first, and it will be a real uncovered statement rather than a sample.
  #
  # And it has been seen to go red, which is the half a green tick never establishes and which the
  # step this file deleted for pretending to check formatting is the standing warning about. On a
  # throwaway branch `sat`'s floor was raised to 93.0 against its measured 92.68 and dispatched: this
  # job failed with `Coverage is below minimum [92.68% < 93.00%]: Stmt:Total` and every other job in
  # the workflow stayed green. That message names the rate and the floor and **not the module**,
  # which is the other reason the reports are uploaded: on a red run the artifact is what says which
  # of the eleven it was.
  #
  # It does not duplicate the suite above. The corpus measurements run under `sbt test` and are
  # skipped when coverage is enabled, which `build.sbt` and `garden.xeno.symbolum.tactics.Corpus`
  # argue for at length: the two commands ask different questions, and the one that costs more than
  # the rest of the build put together is not the one being asked here.
  coverage:
    name: Coverage, with the floors enforced
    runs-on: ubuntu-latest
    # 90 since 2026-10-03, decided by Angelo, and the 60 it replaces was a figure nobody had measured
    # against this job: the four runs between 2026-10-02 and 2026-10-03 were all cancelled at it, so
    # the floors were never asked. The first three stopped inside `SweepSpec`, which the tactics
    # suite then stopped running six times over (`StandardSweep` has that measurement). The fourth,
    # 37147535345 on `39a63eaa`, had `tactics` finish in 21 minutes and was cancelled with `theories`
    # at 120 of its 125 suites, 57 minutes in: on this runner's 4 vCPUs the two modules run side by
    # side and slow each other. So what is measured is a lower bound above 60, not the job's length,
    # and 90 is that bound plus room for the five suites, `dist` and the report. The limit is here to
    # stop a hung job rather than to budget a healthy one, so a run reaching it is a finding to read
    # in the log, never a reason to raise it again unmeasured.
    timeout-minutes: 90

    steps:
      # The whole history, because the step at the end of this job diffs against where the change
      # came from and a shallow clone has no such commit. It is the only job here that needs it.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      # Through the script and not the four sbt commands, for the reason the script's own header
      # gives: they are a sequence, sbt stops at the first failure, and a job that went red said
      # nothing about whether the floors had been asked or the suite had simply broken. Here that
      # is the difference between a red job somebody reads and a red job somebody reruns. The
      # script's last line is the verdict, and it names which of the three happened.
      - name: Coverage, with the floors enforced
        run: sh tools/coverage-gate.sh

      # The second gate, and it answers a question the one above cannot: the floors are on a
      # module's AVERAGE, which is a property of the pair (module, suites that ran) rather than of
      # the module -- 86 statements of difference on one tree between two commands, measured at
      # `30a1452`. What a change adds barely moves that way: the two commands read 98.32% and
      # 98.26% on the same 3164 added statements on 2026-09-19, two statements apart, where the
      # module average crossed its floor. `docs/adr/0035` is the decision, including why the
      # floors above stay.
      #
      # It costs no runner minutes of its own: the step above built the reports and this reads
      # them. It runs whichever way that step went, because a red floor and a poorly covered
      # change are different findings and a reader wants both. Which base each event measures
      # from is decided by the script and held by its test, not by an expression here: the one
      # this replaced was empty on a manual run and read a pull request from its previous push.
      - name: What this change covers
        if: always()
        run: >-
          sh tools/coverage-delta.sh --event "${{ github.event_name }}"
          "${{ github.event.before }}" "${{ github.event.pull_request.base.sha }}"

      # The rate on its own is what lets a nearly empty report pass, so what a reader wants after a
      # run is the statement count beside it and, after a red one, the report itself. Uploaded
      # whichever way the step above went, because the failing run is the one somebody opens.
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-reports
          path: target/out/jvm/scala-3.3.5/symbolum-*/scoverage-report/
          retention-days: 7

  # A gate, unlike the job below it, and the difference is whose work each one is about. This one
  # runs a shell tool of this repository against a repository built for the purpose; a failure here
  # is a defect in something committed here, which is what a gate is for. It runs on a pull request
  # as well, where the report below deliberately does not.
  #
  # It exists because both scripts were green for want of anything to look at, in two different
  # ways. `branches-behind.sh` had nothing to examine, since the remote holds one branch, and it
  # printed its silent line while in the checkout shape it actually runs in it exited 128 on the
  # first branch it met; five hand checks had passed, all on a development machine, where every
  # branch is local and the defect is invisible. `branch-content-landed.sh` declared two shapes of
  # name and extracted one, and the answer for a branch the dead shape was the whole of was "it
  # introduces no name", which reads as a fact about the branch. Neither had a run that could fail.
  #
  # It names the two scripts rather than the directory: `tools/` is not proved by this job, two of
  # its files are, and a job called "shell" would read as coverage of whatever lands there next.
  shell-tools:
    name: The shell tools, against repositories built for the purpose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: branches-behind, in both checkout shapes
        run: sh tools/branches-behind-test.sh

      - name: branch-content-landed, one branch per answer
        run: sh tools/branch-content-landed-test.sh

      # `tools/sbt` decides whether a build goes under the machine's cap, and the runner is exactly
      # the place where no such cap exists: the unnamed case is what CI runs every time, so the
      # three that a developer's machine can be in would otherwise be checked by nobody.
      - name: sbt, the wrapper every command in CLAUDE.md starts at
        run: sh tools/sbt-test.sh

      # The subject of this one cannot be checked by running it: the states it exists to tell
      # apart are a red suite and a run killed part way, and producing either for real means
      # breaking a test on purpose or killing a build at the right second. The stubs reach all of
      # them in a second, which is why the check lives here rather than beside the coverage job.
      - name: coverage-gate, in every state its verdict distinguishes
        run: sh tools/coverage-gate-test.sh

      # And the same reasoning one step along: the subject relates a diff to a report, and on
      # this checkout neither is settable, so the only assertion available here would be "it
      # printed a number". The fixtures set both and know the answer before they ask.
      - name: coverage-delta, one repository per answer
        run: sh tools/coverage-delta-test.sh

      # The subject of this one reads build output, which exists on a machine that has just run a
      # doc build and on no runner that has not. So the classification is checked here against
      # pages written for the purpose, every run, and pointed at the real documentation in the
      # `build` job, which is the only place that documentation exists.
      - name: scaladoc-scope, one page per answer it can give
        run: sh tools/scaladoc-scope-test.sh

      # The subject of this one is pointed at this repository by the `references` job below, and
      # there it has exactly one answer. The case that matters is the one this repository must
      # never contain, so it is exhibited here instead, along with the two shapes of blindness that
      # would otherwise report a clean tree in the same words as a clean tree.
      - name: foreign-reference, one repository per answer it can give
        run: sh tools/foreign-reference-test.sh

  # Its own job rather than a step of another, for a reason about when the answer arrives. It is
  # about the tracked tree and needs no compiler, so putting it behind `test` would delay by twenty
  # minutes a report that is ready at checkout; and it is a gate rather than a report, so it does
  # not belong beside `branches`, which deliberately cannot fail a run.
  #
  # It exists because four tracked files acquired a reference to a numbered clause of a document
  # this repository does not contain, on four separate days, each written by a session with a good
  # local reason, and nothing anywhere went red. The census that found them was itself blind in two
  # ways, which is why the subject refuses to report an absence it has not first earned; its own
  # comment carries both.
  references:
    name: Every cross-reference resolves inside this repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: A reference nothing here resolves
        run: sh tools/foreign-reference.sh

  # Not `needs: test`, and not a gate. What it reports is somebody else's unlanded work, so a
  # blocking check on it stops the wrong person, and making it wait for the suite would delay a
  # warning that has nothing to do with whether this commit is sound.
  #
  # `fetch-depth: 0` because the default checkout fetches one commit and no other branch, and the
  # question is about the other branches. On a pull request the ref is a merge ref rather than a
  # line, and the branches question is about what has landed rather than about what is proposed, so
  # it runs on the push and on a manual dispatch.
  branches:
    name: Branches carrying work the line does not
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout every branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report branches left behind
        run: sh tools/branches-behind.sh "${{ github.ref_name }}"

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      # The runner image carries no sbt. This job had no installation at all until somebody noticed
      # and copied the test job's, which is the same repair applied twice to an installation that
      # does not work; see the note in the test job.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Build package
        run: sbt package

      # Scaladoc reports an unresolvable `[[link]]` as a warning and exits 0, so this step read
      # green over 57 of them on 2026-09-18. Neither `-Xfatal-warnings` nor `-Wconf` reaches it:
      # the log says `Skipping unused scalacOptions: -Werror`, because the doc tool is not the
      # compiler and does not take them. So the gate is a grep over the output, and it costs no
      # runner minutes of its own because this step already runs on every push to a release line
      # and on every pull request.
      #
      # WHAT IT SEES AND WHAT IT DOES NOT. Scaladoc emits one warning per documented symbol and
      # per query, not per occurrence: two `[[Foo]]` in one comment are one line, and the next
      # broken query in that same comment is invisible until the first is repaired. Clearing the
      # 57 took thirteen runs of this command for that reason, 123 warnings and 138 occurrences
      # over 48 files in all. A red build here therefore says at least one link is broken, never
      # how many.
      #
      # It cannot see a link that resolves to the WRONG thing: `[[Undecided]]` written where some
      # other `Undecided` is in scope is a working link to the wrong page, and this repository has
      # four entities by that name. The step after this one put that question to the generated
      # HTML on 2026-09-18 and the answer was that the class is EMPTY for an unqualified query,
      # because scaladoc resolves one only in its writer's own scope and consults no import. So
      # that step is not coverage of this gap; it is what keeps that argument from going stale, and
      # what is left of the gap after it is in `tools/scaladoc-scope.sh`'s own header.
      #
      # SEEN FAILING, 2026-09-18, because a guard observed only passing is untested. Control first,
      # and it had to be run twice: the first was `sbt doc` on a tree where the task was cached, 9
      # log lines, no module documented and an exit 0 that read exactly like a pass. The one that
      # counts is `sbt clean doc` at 248a4c4 with this change's link repairs in place: 11 modules
      # documented, and zero. Read the module count beside the verdict, because an incremental run
      # of this command documents only what recompiled and a zero from six of eleven is a zero
      # about six.
      #
      # What is deliberately NOT here is how long it took, and the first version of this comment
      # carried it. A wall clock is a property of the machine and of what else was on it, which is
      # the argument `CLAUDE.md` makes where it deleted such a figure rather than correcting it;
      # and this one was worse than machine-dependent, because the run that produced it had gone
      # round the machine's build cap while another build held a slot. It was a number nobody
      # could reproduce, offered as though it were one. Then `[[split]]` in `scan/Comments.scala` was made `[[splitTheLinesUp]]`: this step
      # exits 1 and names `Comments.scala:72`, while `sbt scan/test` stays green at 17 tests, which
      # is the half that says this gate is the only thing in the build that sees it. Restored, the
      # step is 0 again with `scan` genuinely re-documented rather than cached.
      #
      # A CENSUS OVER THE SOURCES was the alternative and is not here. It would see every site at
      # once where this sees one per symbol, but it can only ask whether a name exists somewhere,
      # never whether scaladoc can reach it from where it is written, and that is the question:
      # `[[Ring]]` is 14 sites of which exactly one was broken. Of the 123 warnings cleared, not one
      # named something that exists nowhere, so the census would assert an empty difference today,
      # and it would have to read `src/test` as well or report the three links to test classes as
      # missing names. An assertion nothing can make false is the shape this repository already
      # warns about.
      - name: Generate documentation
        run: |
          set -o pipefail
          sbt doc 2>&1 | tee doc.log
          if grep -q 'No DRI found' doc.log; then
            echo '::error::scaladoc could not resolve a [[link]]. Qualify it from the top-level'
            echo '::error::entity of its own file, or write it in backticks if it names another'
            echo '::error::module: scaladoc runs once per module and cannot see across.'
            grep -B 3 'No DRI found' doc.log
            exit 1
          fi

      # The second question over the output of the step above, and it costs no runner minutes of
      # its own for the same reason: the documentation is already built and on disk. The grep above
      # asks whether a link resolved; this asks what it points at.
      #
      # WHAT IT IS A GATE ON, which is not what it looks like. Measured at `d247b58` on 2026-09-18,
      # macOS, Temurin 23, scaladoc 3.3.5, over a `sbt clean doc` of eleven modules: 912 unqualified
      # queries on 551 pages, 656 into the writer's own entity, 25 into a member it inherits, 231
      # into a top-level entity of the module, and ZERO anywhere else. Zero by construction rather
      # than by luck: scaladoc resolves a query in the lexical and inheritance scope of the entity
      # writing it and consults no import, so a name reachable to the compiler and not to that
      # scope comes back as `No DRI found` and is caught by the step above instead. Both halves of
      # that were run rather than reasoned, with a wildcard import and then an explicit one; the
      # script's header has them.
      #
      # So this does not hunt for bad links in the prose, it pins the assumption that argument
      # rests on. It goes red when a scaladoc changes its resolution rules or a module grows a
      # second package repeating a top-level name, and either of those means the measurement has
      # to be taken again rather than a link qualified.
      #
      # A separate step rather than more of the one above because the two fail for different
      # reasons: a red grep says a name reaches nothing and wants the link rewritten or put in
      # backticks; a red scope check says the argument behind this whole arrangement has stopped
      # holding. One step reporting both would make a reader decode which.
      - name: Every unqualified link resolves inside the entity that writes it
        run: sh tools/scaladoc-scope.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scala-build-artifacts
          path: |
            target/out/jvm/scala-3.3.5/symbolum-*/*.jar
            target/out/jvm/scala-3.3.5/symbolum-*/api/
          retention-days: 7
