name: CI

# The triggers name the branches this repository has, which the disabled ones did not: they listed
# `main`, `master`, `develop` and `claude/**`, and the remote holds exactly one branch, `7.0`. The
# `claude/**` ones were pull-request branches from 2025-11 and are gone. Uncommenting them would
# have produced a workflow that is configured to run automatically and never fires, which reads as
# protection and is not.
#
# `[0-9]*.[0-9]*` is a release line: `7.0` today, `7.1` and `8.0` when they exist. A branch that is
# not a release line is verified by opening a pull request against one, or by dispatching this
# workflow by hand, and both are cheaper than running the suite on every push to every experiment.
on:
  workflow_dispatch:
  push:
    branches: [ '[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ '[0-9]*.[0-9]*' ]

# Three commits pushed inside a minute would otherwise start three full runs, two of them already
# obsolete. This keeps the newest and cancels the rest, per branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Scala ${{ matrix.scala }} and JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17' ]
        scala: [ '3.3.5' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      # `cs setup` reports success and leaves sbt unreachable: it puts the binary on the PATH by
      # writing a shell profile, and a workflow step starts a shell that reads none, so the step
      # after this one died with exit code 127. Every run this repository ever recorded failed that
      # way, and the commit that introduced the Coursier installation is called "Fix CI test
      # failures by using Coursier for SBT installation", which no run has ever confirmed.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt test

      # There was a formatting step here and it checked nothing. `scalafmtCheckAll` is not a task
      # this build defines: there is no scalafmt plugin in `project/plugins.sbt` and no
      # `.scalafmt.conf`, so sbt failed, `|| echo` swallowed the failure, and `continue-on-error`
      # swallowed it again. What it produced was a green tick in the job list for a check that could
      # not run and could not fail. Adding scalafmt is a decision about the source; pretending to
      # check it is not, so the step is gone rather than disabled.

  # The gate `build.sbt` describes, run where the memory is. The command is that file's own, word
  # for word, because one measurement described in two places is the defect most of the comments in
  # this repository are about.
  #
  # Why it belongs here rather than only on a development machine. Every floor in `build.sbt` was
  # measured on one laptop, and the run that landed there on 2026-09-16 held between 85 and 207 MB
  # of free memory for its whole ten minutes against a peak resident set of 1922 MB. It passed
  # because nothing else was open at that moment, and `-J-Xmx2g`, which is 458 MB more, is enough to
  # make it die. Verifiability that depends on what else the author has open is not a property a
  # gate can have. A runner has the memory and has nothing else on it.
  #
  # And the hazard `build.sbt` spends a whole section on disappears here by construction rather than
  # by discipline. A report is built from what the instrumented compiler saw, so on an incremental
  # build it covers only the files that were recompiled, and a report over two files passes every
  # floor by being nearly empty. A runner checkout has never been built. What the steps below
  # restore from cache is `~/.ivy2`, `~/.sbt` and coursier, which is dependency resolution and not
  # `target/`; `clean` is kept anyway so that this line and the one a person types are the same
  # line.
  #
  # No `-J-Xmx`, and that is measured rather than cautious. Nothing in this build forks the tests,
  # so the suite runs inside the launcher JVM at sbt's default `-Xmx1024m`, and every floor in
  # `build.sbt` was measured at that heap. Granting more would read the floors against a different
  # run from the one that set them, on top of being what killed the run above.
  #
  # One JDK where the suite above runs two. What a floor gates is which statements execute, and that
  # is the same question on 11 and on 17, so a second copy doubles the minutes and not the answer.
  # 17 rather than 11 because it is the newer of the two the suite already covers. The floors
  # themselves were read on a machine running Temurin 23, so the first run of this job is the first
  # reading of them off that machine, and it changes the JDK at the same time: if a figure moves,
  # both are candidates and neither is established.
  #
  # The triggers are the workflow's, unchanged, and that is the decision rather than the default.
  # Dispatch and pull request alone were the cheap option and would have been protection that does
  # not fire: work lands on this line by pushing to it, so a gate that runs only on a pull request
  # runs about never, which is the sentence the `on:` block above already carries about the branches
  # it does not list. What it costs is measured: the first run took 24 minutes against the 26 the
  # rest of the workflow spends, so a full run is about twice what it was, and the concurrency group
  # above cancels the obsolete ones, which took 7 of the 24 runs on 2026-09-16.
  #
  # What that buys and what it risks are both small and both worth knowing. Every floor held on the
  # first run with between 1.9 and 43 statements of margin, and `build.sbt` carries the table. The
  # one to watch is `scan`: 185 statements at 99.0 is one statement of slack, so that module is where
  # a red line will come from first, and it will be a real uncovered statement rather than a sample.
  #
  # And it has been seen to go red, which is the half a green tick never establishes and which the
  # step this file deleted for pretending to check formatting is the standing warning about. On a
  # throwaway branch `sat`'s floor was raised to 93.0 against its measured 92.68 and dispatched: this
  # job failed with `Coverage is below minimum [92.68% < 93.00%]: Stmt:Total` and every other job in
  # the workflow stayed green. That message names the rate and the floor and **not the module**,
  # which is the other reason the reports are uploaded: on a red run the artifact is what says which
  # of the eleven it was.
  #
  # It does not duplicate the suite above. The corpus measurements run under `sbt test` and are
  # skipped when coverage is enabled, which `build.sbt` and `garden.xeno.symbolum.tactics.Corpus`
  # argue for at length: the two commands ask different questions, and the one that costs more than
  # the rest of the build put together is not the one being asked here.
  coverage:
    name: Coverage, with the floors enforced
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Coverage, with the floors enforced
        run: sbt clean coverage test coverageReport

      # The rate on its own is what lets a nearly empty report pass, so what a reader wants after a
      # run is the statement count beside it and, after a red one, the report itself. Uploaded
      # whichever way the step above went, because the failing run is the one somebody opens.
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-reports
          path: modules/*/target/scala-3.3.5/scoverage-report/
          retention-days: 7

  # A gate, unlike the job below it, and the difference is whose work each one is about. This one
  # runs a shell tool of this repository against a repository built for the purpose; a failure here
  # is a defect in something committed here, which is what a gate is for. It runs on a pull request
  # as well, where the report below deliberately does not.
  #
  # It exists because both scripts were green for want of anything to look at, in two different
  # ways. `branches-behind.sh` had nothing to examine, since the remote holds one branch, and it
  # printed its silent line while in the checkout shape it actually runs in it exited 128 on the
  # first branch it met; five hand checks had passed, all on a development machine, where every
  # branch is local and the defect is invisible. `branch-content-landed.sh` declared two shapes of
  # name and extracted one, and the answer for a branch the dead shape was the whole of was "it
  # introduces no name", which reads as a fact about the branch. Neither had a run that could fail.
  #
  # It names the two scripts rather than the directory: `tools/` is not proved by this job, two of
  # its files are, and a job called "shell" would read as coverage of whatever lands there next.
  shell-tools:
    name: The shell tools, against repositories built for the purpose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: branches-behind, in both checkout shapes
        run: sh tools/branches-behind-test.sh

      - name: branch-content-landed, one branch per answer
        run: sh tools/branch-content-landed-test.sh

      # `tools/sbt` decides whether a build goes under the machine's cap, and the runner is exactly
      # the place where no such cap exists: the unnamed case is what CI runs every time, so the
      # three that a developer's machine can be in would otherwise be checked by nobody.
      - name: sbt, the wrapper every command in CLAUDE.md starts at
        run: sh tools/sbt-test.sh

  # Not `needs: test`, and not a gate. What it reports is somebody else's unlanded work, so a
  # blocking check on it stops the wrong person, and making it wait for the suite would delay a
  # warning that has nothing to do with whether this commit is sound.
  #
  # `fetch-depth: 0` because the default checkout fetches one commit and no other branch, and the
  # question is about the other branches. On a pull request the ref is a merge ref rather than a
  # line, and the branches question is about what has landed rather than about what is proposed, so
  # it runs on the push and on a manual dispatch.
  branches:
    name: Branches carrying work the line does not
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout every branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report branches left behind
        run: sh tools/branches-behind.sh "${{ github.ref_name }}"

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'

      # The runner image carries no sbt. This job had no installation at all until somebody noticed
      # and copied the test job's, which is the same repair applied twice to an installation that
      # does not work; see the note in the test job.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Build package
        run: sbt package

      # Scaladoc reports an unresolvable `[[link]]` as a warning and exits 0, so this step read
      # green over 57 of them on 2026-09-18. Neither `-Xfatal-warnings` nor `-Wconf` reaches it:
      # the log says `Skipping unused scalacOptions: -Werror`, because the doc tool is not the
      # compiler and does not take them. So the gate is a grep over the output, and it costs no
      # runner minutes of its own because this step already runs on every push to a release line
      # and on every pull request.
      #
      # WHAT IT SEES AND WHAT IT DOES NOT. Scaladoc emits one warning per documented symbol and
      # per query, not per occurrence: two `[[Foo]]` in one comment are one line, and the next
      # broken query in that same comment is invisible until the first is repaired. Clearing the
      # 57 took thirteen runs of this command for that reason, 123 warnings and 138 occurrences
      # over 48 files in all. A red build here therefore says at least one link is broken, never
      # how many.
      #
      # It cannot see a link that resolves to the WRONG thing, which is the failure this leaves
      # standing: `[[Undecided]]` written in a file where some other `Undecided` is in scope is a
      # working link to the wrong page, and nothing here or anywhere else in this repository asks
      # that question.
      #
      # SEEN FAILING, 2026-09-18, because a guard observed only passing is untested. Control first,
      # and it had to be run twice: the first was `sbt doc` on a tree where the task was cached, 9
      # log lines, no module documented and an exit 0 that read exactly like a pass. The one that
      # counts is `sbt clean doc` at 248a4c4 with this change's link repairs in place, 11 modules
      # documented in 661 s and zero. Read the module count beside the verdict: an incremental run
      # of this command documents only what recompiled, and a zero from six of eleven is a zero
      # about six. Then `[[split]]` in `scan/Comments.scala` was made `[[splitTheLinesUp]]`: this step
      # exits 1 and names `Comments.scala:72`, while `sbt scan/test` stays green at 17 tests, which
      # is the half that says this gate is the only thing in the build that sees it. Restored, the
      # step is 0 again with `scan` genuinely re-documented rather than cached.
      #
      # A CENSUS OVER THE SOURCES was the alternative and is not here. It would see every site at
      # once where this sees one per symbol, but it can only ask whether a name exists somewhere,
      # never whether scaladoc can reach it from where it is written, and that is the question:
      # `[[Ring]]` is 14 sites of which exactly one was broken. Of the 123 warnings cleared, not one
      # named something that exists nowhere, so the census would assert an empty difference today,
      # and it would have to read `src/test` as well or report the three links to test classes as
      # missing names. An assertion nothing can make false is the shape this repository already
      # warns about.
      - name: Generate documentation
        run: |
          set -o pipefail
          sbt doc 2>&1 | tee doc.log
          if grep -q 'No DRI found' doc.log; then
            echo '::error::scaladoc could not resolve a [[link]]. Qualify it from the top-level'
            echo '::error::entity of its own file, or write it in backticks if it names another'
            echo '::error::module: scaladoc runs once per module and cannot see across.'
            grep -B 3 'No DRI found' doc.log
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scala-build-artifacts
          path: |
            modules/*/target/scala-3.3.5/*.jar
            modules/*/target/scala-3.3.5/api/
          retention-days: 7
