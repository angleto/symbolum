name: CI

on:
  workflow_dispatch:  # Only allow manual runs
  # Automatic triggers disabled to avoid GitHub Actions billing
  # push:
  #   branches: [ main, master, develop, 'claude/**' ]
  # pull_request:
  #   branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Scala ${{ matrix.scala }} and JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17' ]
        scala: [ '3.3.5' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      - name: Setup Coursier
        run: |
          curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > cs
          chmod +x cs
          ./cs setup --yes --jvm system

      - name: Verify SBT installation
        run: sbt --version

      - name: Cache SBT dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt test

      - name: Check formatting
        run: sbt scalafmtCheckAll || echo "Scalafmt not configured, skipping"
        continue-on-error: true

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'

      - name: Build package
        run: sbt package

      - name: Generate documentation
        run: sbt doc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: scala-build-artifacts
          path: |
            target/scala-3.3.5/*.jar
            target/scala-3.3.5/api/
          retention-days: 7
