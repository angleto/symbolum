name: CI

# The triggers name the branches this repository has, which the disabled ones did not: they listed
# `main`, `master`, `develop` and `claude/**`, and the remote holds exactly one branch, `7.0`. The
# `claude/**` ones were pull-request branches from 2025-11 and are gone. Uncommenting them would
# have produced a workflow that is configured to run automatically and never fires, which reads as
# protection and is not.
#
# `[0-9]*.[0-9]*` is a release line: `7.0` today, `7.1` and `8.0` when they exist. A branch that is
# not a release line is verified by opening a pull request against one, or by dispatching this
# workflow by hand, and both are cheaper than running the suite on every push to every experiment.
on:
  workflow_dispatch:
  push:
    branches: [ '[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ '[0-9]*.[0-9]*' ]

# Three commits pushed inside a minute would otherwise start three full runs, two of them already
# obsolete. This keeps the newest and cancels the rest, per branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Scala ${{ matrix.scala }} and JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11', '17' ]
        scala: [ '3.3.5' ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      # `cs setup` reports success and leaves sbt unreachable: it puts the binary on the PATH by
      # writing a shell profile, and a workflow step starts a shell that reads none, so the step
      # after this one died with exit code 127. Every run this repository ever recorded failed that
      # way, and the commit that introduced the Coursier installation is called "Fix CI test
      # failures by using Coursier for SBT installation", which no run has ever confirmed.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt test

      # There was a formatting step here and it checked nothing. `scalafmtCheckAll` is not a task
      # this build defines: there is no scalafmt plugin in `project/plugins.sbt` and no
      # `.scalafmt.conf`, so sbt failed, `|| echo` swallowed the failure, and `continue-on-error`
      # swallowed it again. What it produced was a green tick in the job list for a check that could
      # not run and could not fail. Adding scalafmt is a decision about the source; pretending to
      # check it is not, so the step is gone rather than disabled.

  # Not `needs: test`, and not a gate. What it reports is somebody else's unlanded work, so a
  # blocking check on it stops the wrong person, and making it wait for the suite would delay a
  # warning that has nothing to do with whether this commit is sound.
  #
  # `fetch-depth: 0` because the default checkout fetches one commit and no other branch, and the
  # question is about the other branches. On a pull request the ref is a merge ref rather than a
  # line, and the branches question is about what has landed rather than about what is proposed, so
  # it runs on the push and on a manual dispatch.
  branches:
    name: Branches carrying work the line does not
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout every branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report branches left behind
        run: sh tools/branches-behind.sh "${{ github.ref_name }}"

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'

      # The runner image carries no sbt. This job had no installation at all until somebody noticed
      # and copied the test job's, which is the same repair applied twice to an installation that
      # does not work; see the note in the test job.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify SBT installation
        run: sbt --version

      - name: Build package
        run: sbt package

      - name: Generate documentation
        run: sbt doc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scala-build-artifacts
          path: |
            modules/*/target/scala-3.3.5/*.jar
            modules/*/target/scala-3.3.5/api/
          retention-days: 7
