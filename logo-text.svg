<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo with text version -->
  <defs>
    <linearGradient id="sigmaGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#81A1C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E81AC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5E81AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81A1C1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#2E3440" rx="10"/>

  <!-- Icon part - Sigma in circle -->
  <g transform="translate(20, 30)">
    <circle cx="70" cy="70" r="65" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>

    <!-- Greek Uppercase Sigma (Σ) -->
    <path d="M 35 40 L 105 40 L 105 48 L 53 48 L 80 70 L 53 92 L 105 92 L 105 100 L 35 100 L 35 90 L 75 90 L 50 70 L 75 50 L 35 50 Z"
          fill="url(#sigmaGradient2)"
          stroke="#ECEFF4"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Text "SYMBOLICAS" -->
  <text x="180" y="115"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="url(#textGradient)"
        letter-spacing="2">SYMBOLICAS</text>

  <!-- Subtitle -->
  <text x="182" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#88C0D0"
        letter-spacing="3">COMPUTER ALGEBRA SYSTEM</text>
</svg>
