<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo with text version -->
  <defs>
    <linearGradient id="sigmaGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E81AC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="integralGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF616A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D08770;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5E81AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81A1C1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#2E3440" rx="10"/>

  <!-- Icon part - Combined Sigma and Integral -->
  <g transform="translate(20, 30)">
    <circle cx="70" cy="70" r="65" fill="#3B4252" stroke="#4C566A" stroke-width="2"/>

    <!-- Sigma Symbol (Σ) - correctly oriented, scaled down -->
    <path d="M 40 40 L 100 40 L 70 70 L 100 100 L 40 100 L 40 93 L 88 93 L 61 70 L 88 47 L 40 47 Z"
          fill="url(#sigmaGradient2)"
          stroke="#ECEFF4"
          stroke-width="2"
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Integral Symbol (∫) - interwoven -->
    <path d="M 92 48 Q 97 43 102 41 Q 107 39 112 39 Q 115 39 115 42
             L 115 98 Q 115 101 117 103 Q 119 105 122 106"
          stroke="url(#integralGradient2)"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"
          opacity="0.95"
          filter="url(#glow2)"/>

    <!-- Integral hooks -->
    <path d="M 112 39 Q 109 37 106 36"
          stroke="url(#integralGradient2)"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"
          opacity="0.95"/>

    <path d="M 122 106 Q 125 107 128 109"
          stroke="url(#integralGradient2)"
          stroke-width="6"
          fill="none"
          stroke-linecap="round"
          opacity="0.95"/>
  </g>

  <!-- Text "SYMBOLICAS" -->
  <text x="180" y="115"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="url(#textGradient)"
        letter-spacing="2">SYMBOLICAS</text>

  <!-- Subtitle -->
  <text x="182" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#88C0D0"
        letter-spacing="3">COMPUTER ALGEBRA SYSTEM</text>
</svg>
