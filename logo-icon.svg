<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple icon version for small displays -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E81AC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#2E3440" rx="20"/>

  <!-- Sigma symbol - centered and simplified -->
  <path d="M 50 60 L 150 60 L 100 100 L 150 140 L 50 140 L 50 125 L 125 125 L 80 100 L 125 75 L 50 75 Z"
        fill="url(#iconGradient)"
        stroke="#ECEFF4"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Small accent dot -->
  <circle cx="160" cy="165" r="5" fill="#A3BE8C"/>
</svg>
