<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#2E3440" stroke="#4C566A" stroke-width="4"/>

  <!-- Main Sigma symbol (Σ) with gradient -->
  <defs>
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E81AC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF616A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D08770;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stylized Sigma (Σ) for symbolic mathematics -->
  <path d="M 140 120 L 260 120 L 200 200 L 260 280 L 140 280 L 140 260 L 220 260 L 170 200 L 220 140 L 140 140 Z"
        fill="url(#symbolGradient)"
        stroke="#ECEFF4"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Mathematical accent elements -->
  <!-- Integral symbol (∫) - smaller, as accent -->
  <path d="M 280 160 Q 285 150 290 145 Q 295 140 300 140 Q 302 140 302 142 L 302 230 Q 302 235 305 238 Q 308 240 312 240"
        stroke="url(#accentGradient)"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"/>

  <!-- Derivative notation (d/dx) - as small accent -->
  <text x="95" y="250" font-family="Times New Roman, serif" font-size="32" fill="url(#accentGradient)" font-style="italic">∂</text>

  <!-- Small dots representing variables/terms -->
  <circle cx="290" cy="260" r="4" fill="#A3BE8C"/>
  <circle cx="305" cy="270" r="4" fill="#A3BE8C"/>
  <circle cx="100" cy="165" r="4" fill="#EBCB8B"/>
  <circle cx="85" cy="175" r="4" fill="#EBCB8B"/>
</svg>
