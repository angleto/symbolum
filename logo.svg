<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#2E3440" stroke="#4C566A" stroke-width="4"/>

  <!-- Gradient for Sigma -->
  <defs>
    <linearGradient id="sigmaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#81A1C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E81AC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Greek Uppercase Sigma (Σ) -->
  <path d="M 110 90 L 290 90 L 290 115 L 160 115 L 240 200 L 160 285 L 290 285 L 290 310 L 110 310 L 110 280 L 210 280 L 140 200 L 210 120 L 110 120 Z"
        fill="url(#sigmaGradient)"
        stroke="#ECEFF4"
        stroke-width="4"
        stroke-linejoin="round"/>
</svg>
